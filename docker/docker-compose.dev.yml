version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: manageplat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-manageplat}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max_connections=500
    networks:
      - manageplat-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: manageplat-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: ${JWT_SECRET:-manageplat-secret-key-change-in-production}
      HANA_HOST: ${HANA_HOST:-hana}
      HANA_PORT: ${HANA_PORT:-30015}
      HANA_PASSWORD: ${HANA_PASSWORD:-hana123}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - manageplat-network

  frontend:
    image: node:18-alpine
    container_name: manageplat-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    networks:
      - manageplat-network

volumes:
  mysql_data:
    driver: local
  node_modules:

networks:
  manageplat-network:
    driver: bridge
